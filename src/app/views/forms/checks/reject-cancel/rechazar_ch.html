<h2 class="form-title">RECHAZO DEL CHEQUE</h2>

<form id="rechazaranularcheque">
    <div class="form-grid">

        <div class="form-group">
            <label for="fecha_destino">Fecha de Rechazo <span>*</span></label>
            <input type="date" id="fecha_destino" name="fecha_destino" required>
        </div>

        <div class="form-group">
            <label for="motivo">Motivo <span>*</span></label>
            <input type="text" id="motivo" name="motivo" maxlength="250" placeholder="Motivo..." required>
        </div>

    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-cancel" data-close-modal>Cancelar</button>
        <button type="submit" id="btn-rechazar" class="btn btn-primary">Aplicar</button>
    </div>
</form>
