<div class="form-title">IMPUTAR CHEQUE DE TERCEROS</div>
<form id="form_imputar_chequetercero" class="form-grid">
    <div class="form-group">
        <label for="fecha_destino">Fecha Destino <span>*</span></label>
        <input type="date" id="fecha_destino" name="fecha_destino" required>
    </div>
    
    <div class="form-group">
        <label for="uso">Uso <span>*</span></label>
        <select id="uso" name="uso" required>
            <option value="" disabled selected hidden>Elije una opción...</option>
            <option value="D">Depósito</option>
            <option value="E">Endoso</option>
        </select>
    </div>

    <div class="form-group">
        <label for="id_cuenta_propia_imputar">Cuenta de Entrada <span>*</span><small> (depósito)</small></label>
        <select id="id_cuenta_propia_imputar" name="id_cuenta_propia_imputar" placeholder="Elije una opción..." disabled></select>
    </div>

    <div class="form-group">
        <label for="id_clipro_imputar">Destino <span>*</span><small> (endoso)</small></label>
        <select id="id_clipro_imputar" name="id_clipro_imputar" placeholder="Elije una opción..." disabled></select>
    </div>

    <div class="form-group">
        <label for="id_concepto_imputar">Cuenta de Salida <span>*</span><small> (endoso)</small></label>
        <select id="id_concepto_imputar" name="id_concepto_imputar" placeholder="Elije una opción..." disabled></select>
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-cancel" data-close-modal>Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
</form>
