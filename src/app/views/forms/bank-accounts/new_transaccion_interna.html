<h2 class="form-title">REALIZAR TRANSACCION INTERNA</h2>

<form id="form_new_transaccion_interna" class="form">
    <div class="form-grid">

        <div class="form-group">
            <label for="cuenta_origen">Cuenta Origen <span>*</span></label>
            <select id="cuenta_origen" name="cuenta_origen" placeholder="Seleccione una cuenta" required></select>
        </div>

        <div class="form-group">
            <label for="cuenta_destino">Cuenta Destino <span>*</span></label>
            <select id="cuenta_destino" name="cuenta_destino" placeholder="Seleccione una cuenta" required></select>
        </div>

        <div class="form-group">
            <label for="saldo_cuenta">Monto <span>*</span></label>
            <input type="text" id="saldo_cuenta" name="saldo_cuenta" inputmode="decimal" placeholder="0,00" required>
        </div>
    </div>

    <div class="form-actions">
        <button type="reset" id="btn-cancel" class="btn btn-cancel" data-close-modal>Cancelar</button>
        <button type="submit" id="btn-primary" class="btn btn-primary">Guardar</button>
    </div>
</form>
