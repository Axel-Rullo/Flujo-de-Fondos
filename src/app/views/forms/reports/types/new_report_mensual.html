<h2 class="form-title">ELEGIR PERIODO</h2>

<form id="form_report_mensual" class="form">
    <div class="form-grid">
        <div class="form-group">
            <label for="desde">Desde <span>*</span></label>
            <input type="date" id="desde" name="desde" required>
        </div>

        <div class="form-group">
            <label for="hasta">Hasta <span>*</span></label>
            <input type="date" id="hasta" name="hasta" required>
        </div>
    </div>

    <div class="form-actions">
        <button type="reset" id="btn-cancel" class="btn btn-cancel" data-close-modal>Cancelar</button>
        <button type="submit" id="btn-primary" class="btn btn-primary">Aplicar</button>
    </div>
</form>
