<h2 class="form-title">NUEVO MOVIMIENTO</h2>

<form id="form_new_movimientos">
<div class="form-grid">

    <div class="form-group">
        <label for="fecha_emision">Fecha de Emision <span>*</span></label>
        <input type="date" id="fecha_emision" name="fecha_emision" required>
    </div>

    <div class="form-group">
        <label for="id_cuenta_propia_emision">Cuenta Propia <span>*</span></label>
        <select id="id_cuenta_propia_emision" name="id_cuenta_propia_emision" placeholder="Elije una opción..." required></select>
    </div>

    <div class="form-group">
        <label for="importe">Importe <span>*</span></label>
        <input type="text" id="importe" name="importe" inputmode="decimal" placeholder="0,00" required>
    </div>

    <div class="form-group">
        <label for="id_concepto_emision">Concepto <span>*</span></label>
        <select id="id_concepto_emision" name="id_concepto_emision" placeholder="Elije una opción..." required></select>
    </div>

    <div class="form-group">
        <label for="tipo_movimiento">Tipo <span>*</span></label>
        <select id="tipo_movimiento" name="tipo_movimiento" required>
            <option value="" disabled selected hidden>Elije una opción...</option>
            <option value="I">Ingreso</option>
            <option value="E">Egreso</option>
        </select>
    </div>

    <div class="form-group">
        <label for="observaciones">Observaciones <small>(opcional)</small></label>
        <input type="text" id="observaciones" name="observaciones" maxlength="250" placeholder="Observaciones...">
    </div>

    <div class="form-group">
        <label for="operacion">Operación <span>*</span></label>
        <textarea id="operacion" name="operacion" maxlength="250" placeholder="Operación..." rows="4"></textarea>
    </div>
</div>

<div class="form-actions">
    <button type="button" class="btn btn-cancel" data-close-modal>Cancelar</button>
    <button type="submit" class="btn btn-primary">Guardar</button>
</div>
</form>
