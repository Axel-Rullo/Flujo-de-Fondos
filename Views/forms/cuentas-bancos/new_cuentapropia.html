<h2 class="form-title">REGISTRAR NUEVA CUENTA PROPIA</h2>

<form id="form_new_cuentapropia" class="form">
    <div class="form-grid">

        <div class="form-group">
            <label for="name">Nombre <span>*</span></label>
            <input type="text" id="name" name="name" placeholder="Nombre referencial..." required>
        </div>

        <div class="form-group">
            <label for="type_cuenta">Tipo <span>*</span></label>
            <select id="type_cuenta" name="type_cuenta" required>
                <option value="" disabled selected hidden>Elije una opción...</option>
                <option value="C">Caja</option>
                <option value="B">Banco</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="banco">Banco <span>*</span></label>
            <select id="banco" name="banco" placeholder="Elije una opción..." required disabled></select>
        </div>
    </div>

    <div class="form-actions">
        <button type="reset" id="btn-cancel" class="btn btn-cancel" data-close-modal>Cancelar</button>
        <button type="submit" id="btn-primary" class="btn btn-primary">Guardar</button>
    </div>
</form>
