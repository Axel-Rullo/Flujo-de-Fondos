<h2 class="form-title">REGISTRAR NUEVO BANCO</h2>

<form id="form_new_banco" class="form">
    <div class="form-grid">

        <div class="form-group">
            <label for="name">Nombre <span>*</span></label>
            <input type="text" id="name" name="name" placeholder="Banco..." required>
        </div>

    </div>

    <div class="form-actions">
        <button type="reset" id="btn-cancel" class="btn btn-cancel" data-close-modal>Cancelar</button>
        <button type="submit" id="btn-primary" class="btn btn-primary">Guardar</button>
    </div>
</form>
