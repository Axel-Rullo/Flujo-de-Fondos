<h2 class="form-title">ENLAZAR BANCO CON CLIENTE</h2>

<form id="form_new_banco_cliente" class="form">
    <div class="form-grid">

        <div class="form-group">
            <label for="banco">Banco <span>*</span></label>
            <select id="banco" name="banco" placeholder="Elije una opción..." required></select>
        </div>

        <div class="form-group">
            <label for="titular">Cliente / Proveedor <span>*</span></label>
            <select id="titular" name="id_titular" placeholder="Elije una opción..." required></select>
        </div>

        <div class="form-group">
            <label for="alias">Alias <span>*</span></label>
            <input type="text" id="alias" name="alias" placeholder="Alias de su cuenta..." required>
        </div>
        
    </div>

    <div class="form-actions">
        <button type="reset" id="btn-cancel" class="btn btn-cancel" data-close-modal>Cancelar</button>
        <button type="submit" id="btn-primary" class="btn btn-primary">Guardar</button>
    </div>
</form>
