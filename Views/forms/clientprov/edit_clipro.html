<!-- ── HTML ──────────────────────────────────────────────────────── -->
<h2 class="form-title">EDITAR CLIENTE/PROVEEDOR</h2>

<form id="form_edit_clipro" class="form">
    <div id="new_clipro" class="form-grid">

        <div class="form-group">
            <label for="name">Nombre <span>*</span></label>
            <input type="text" id="name" name="name" placeholder="Nombre..." required>
        </div>

        <div class="form-group">
            <label for="lastname">Apellido <span>*</span></label>
            <input type="text" id="lastname" name="lastname" placeholder="Apellido..." required>
        </div>

        <div class="form-group">
            <label for="dni">DNI/CUIT <span>*</span></label>
            <input type="text" id="dni" name="dni" placeholder="DNI..." required>
        </div>

        <div class="form-group">
            <label for="phone_number">Telefono <span>*</span></label>
            <input type="text" id="phone_number" name="phone_number" placeholder="Telefono..." required>
        </div>

        <div class="form-group">
            <label for="email">Email <span>*</span></label>
            <input type="text" id="email" name="email" placeholder="Email..." required>
        </div>

        <div class="form-group">
            <label for="type">Tipo <span>*</span></label>
            <select id="type" name="type" required>
                <option value="" disabled selected></option>
                <option value="C">Cliente</option>
                <option value="P">Proveedor</option>
            </select>
        </div>

        <div class="form-group">
            <label for="localidad">Localidad <span>*</span></label>
            <input type="text" id="localidad" name="localidad" placeholder="Localidad..." required>
        </div>
        
    </div>

    <div class="form-actions">
        <button type="reset" id="btn-cancel" class="btn btn-cancel" data-modal="Views/forms/clientprov/clipro_list.html">Cancelar</button>
        <button type="button" id="btn-delete-clipro" class="btn btn-delete">Borrar</button>
        <button type="submit" id="btn-primary" class="btn btn-primary">Guardar</button>
    </div>
</form>
