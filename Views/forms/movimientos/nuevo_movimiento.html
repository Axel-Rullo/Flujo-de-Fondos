<!-- ── HTML ──────────────────────────────────────────────────────── -->
<h2 class="form-title">Nuevo Movimiento</h2>

<form id="form-transaccion">
<div class="form-grid">

    <div class="form-group">
        <label for="tipo">Tipo</label>
        <select id="tipo" class="tipo" name="tipo" placeholder="tipo..." required></select>
    </div>

    <div class="form-group">
        <label for="concepto">Concepto</label>
        <input type="text" id="concepto" name="concepto" placeholder="Descripción del movimiento...">
    </div>

    <div class="form-group">
        <label for="importe">Importe</label>
        <input type="number" id="importe" name="importe" placeholder="0.00" step="0.01">
    </div>

    <div class="form-group">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha">
    </div>

    <div class="form-group">
        <label for="cuenta">Cuenta</label>
        <select id="cuenta" class="cuenta" name="cuenta" placeholder="Cuenta..." required></select>
    </div>

    <div class="form-group">
            <label for="branch">Sucursal</label>
            <select id="branch" class="branch" name="branch" placeholder="Sucursal..." required></select>
        </div>

    <div class="form-group">
        <label for="observaciones">Observaciones</label>
        <input type="text" id="observaciones" name="observaciones" placeholder="Observaciones...">
    </div>
</div>

<div class="form-actions">
    <button type="button" class="btn btn-cancel" data-close-modal>Cancelar</button>
    <button type="submit" class="btn btn-primary">Guardar</button>
</div>
</form>
