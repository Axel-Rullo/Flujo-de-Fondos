<h2 class="form-title">CHEQUE PROPIO</h2>

<form id="form_new_chequepropio">
    <div class="form-grid">

        <div class="form-group">
            <label for="numero">Número de Cheque <span>*</span></label>
            <input type="text" id="numero" name="numero" placeholder="Número de Cheque..." required>
        </div>

        <div class="form-group">
            <label for="importe">Importe <span>*</span></label>
            <input type="text" id="importe" name="importe" inputmode="decimal" placeholder="0,00" required>
        </div>

        <div class="form-group">
            <label for="tipo">Tipo <span>*</span></label>
            <select id="tipo" name="tipo" required>
                <option value="" disabled selected hidden>Elije una opción...</option>
                <option value="C">Corriente</option>
                <option value="D">Diferido</option>
            </select>
        </div>

        <div class="form-group">
            <label for="id_clipro_emision">Destino <span>*</span></label>
            <select id="id_clipro_emision" name="id_clipro_emision" placeholder="Elije una opción..." required></select>
        </div>

        <div class="form-group">
            <label for="fecha_emision">Fecha de Emision <span>*</span></label>
            <input type="date" id="fecha_emision" name="fecha_emision" required>
        </div>

        <div class="form-group">
            <label for="id_cuenta_propia_emision">Banco <span>*</span></label>
            <select id="id_cuenta_propia_emision" name="id_cuenta_propia_emision" placeholder="Elije una opción..." required></select>
        </div>

        <div class="form-group">
            <label for="fecha_pago">Fecha de Pago <span>*</span><small> (solo CH Diferido)</small></label>
            <input type="date" id="fecha_pago" name="fecha_pago" required disabled>
        </div>

        <div class="form-group">
            <label for="id_concepto_emision">Cuenta de Salida <span>*</span></label>
            <select id="id_concepto_emision" name="id_concepto_emision" placeholder="Elije una opción..." required></select>
        </div>

        <div class="form-group">
            <label for="observaciones">Observaciones <small>(opcional)</small></label>
            <input type="text" id="observaciones" name="observacion" placeholder="Observaciones...">
        </div>
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-cancel" data-close-modal>Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
</form>
