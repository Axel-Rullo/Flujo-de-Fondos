<h2 class="form-title">CHEQUE DE TERCEROS</h2>

<form id="form_new_chequetercero">
    <div class="form-grid">

        <div class="form-group">
            <label for="numero">Número de Cheque <span>*</span></label>
            <input type="text" id="numero" name="numero" placeholder="Número de Cheque..." required>
        </div>

        <div class="form-group">
            <label for="importe">Importe <span>*</span></label>
            <input type="text" id="importe" name="importe" placeholder="0.00" step="0.01" required>
        </div>

        <div class="form-group">
            <label for="fecha_entrega">Fecha de Emisión <span>*</span></label>
            <input type="date" id="fecha_entrega" name="fecha_entrega" required>
        </div>

        <div class="form-group">
            <label for="fecha_cobro">Fecha de Vencimiento <span>*</span></label>
            <input type="date" id="fecha_cobro" name="fecha_cobro" required>
        </div>

        <div class="form-group">
            <label for="titular_origen">Titular de Origen <span>*</span></label>
            <input type="text" id="titular_origen" name="titular_origen" placeholder="Titular de Origen..." required>
        </div>

        <div class="form-group">
            <label for="titular_destino">Titular de Destino <span>*</span></label>
            <input type="text" id="titular_destino" name="titular_destino" placeholder="Titular de Destino..." required>
        </div>

        <div class="form-group">
            <label for="cuenta_entrada">Cuenta de Entrada <span>*</span></label>
            <input type="text" id="cuenta_entrada" name="cuenta_entrada" placeholder="Cuenta de Entrada..." required>
        </div>

        <div class="form-group">
            <label for="cuenta_salida">Cuenta de Salida <span>*</span></label>
            <input type="text" id="cuenta_salida" name="cuenta_salida" placeholder="Cuenta de Salida..." required>
        </div>

        <div class="form-group">
            <label for="uso">Uso <span>*</span></label>
            <input type="text" id="uso" name="uso" placeholder="Uso..." required>
        </div>

        <div class="form-group">
            <label for="observaciones">Observaciones <span>*</span></label>
            <input type="text" id="observaciones" name="observaciones" placeholder="Observaciones..." required>
        </div>
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-cancel" data-close-modal>Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
</form>
