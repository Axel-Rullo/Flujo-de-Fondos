<h2 class="form-title">Cheque Propio</h2>

<form id="form-cheque">
    <div class="form-grid">

        <div class="form-group">
            <label for="tipo_cheque">Tipo</label>
            <select id="tipo_cheque" name="tipo_cheque">
                <option value="">Seleccionar...</option>
                <option value="propio">A Pagar</option>
                <option value="tercero">A Cobrar</option>
            </select>
        </div>

        <div class="form-group">
            <label for="importe">Importe</label>
            <input type="number" id="importe" name="importe" placeholder="0.00" step="0.01">
        </div>

        <div class="form-group">
            <label for="fecha_entrega">Fecha de Emisión</label>
            <input type="date" id="fecha_entrega" name="fecha_entrega">
        </div>

        <div class="form-group">
            <label for="fecha_cobro">Fecha de Vencimiento</label>
            <input type="date" id="fecha_cobro" name="fecha_cobro">
        </div>

        <div class="form-group">
            <label for="titular">Titular</label>
            <input type="text" id="titular" name="titular" placeholder="Titular...">
        </div>

        <div class="form-group">
            <label for="cuenta_salida">Cuenta de Salida</label>
            <input type="text" id="cuenta_salida" name="cuenta_salida" placeholder="Cuenta de Salida...">
        </div>

        <div class="form-group">
            <label for="observaciones">Observaciones</label>
            <input type="text" id="observaciones" name="observaciones" placeholder="Observaciones...">
        </div>
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-cancel" data-close-modal>Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
</form>
