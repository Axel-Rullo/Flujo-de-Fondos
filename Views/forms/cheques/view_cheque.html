<div id="view_cheque" class="view_cheque">
    <div class="form-title">
        <div class="icon-cheque">
            <svg width="22" height="22" viewBox="0 0 24 24"><use href="#icon-cheque" xlink:href="#icon-cheque"/></svg>
        </div>
        <div class="number-type">
        <span class="number value"></span>
            <span class="type value"></span>
        </div>
    </div>

    <div class="form-variant-cheque">
        <div class="cheque-details">
            <span class="cash"></span>
            <span class="status"></span>
        </div>
        <div class="section-cheque">
            <div class="section-label">Fechas</div>
            <div class="grid">
                <div class="row">
                    <span class="label">Fecha de Emision</span>
                    <span class="fecha_emision value"></span>
                </div>
                <div class="row">
                    <span class="label">Fecha de Pago</span>
                    <span class="fecha_pago value"></span>
                </div>
                <div class="row">
                    <span class="label">Fecha de Cobro</span>
                    <span class="fecha_vencimiento value"></span>
                </div>
                <div class="row">
                    <span class="label">Fecha de Destino</span>
                    <span class="fecha_destino value"></span>
                </div>
            </div>
        </div>
        <div class="section-cheque">
            <div class="section-label">Titulares y Cuentas</div>
            <div class="grid">
                <div class="row">
                    <span class="label">Cliente / Proveedor</span>
                    <span class="clipro_emision value"></span>
                </div>
                <div class="row">
                    <span class="cuenta_banco_emision_label label"></span>
                    <span class="cuenta_banco_emision value"></span>
                </div>
                <div class="row">
                    <span class="concepto_emision_label label"></span>
                    <span class="concepto_emision value"></span>
                </div>
                <div class="row">
                    <span class="label">Otorgado por</span>
                    <span class="otorgado_por value"></span>
                </div>
            </div>
        </div>
        <div class="section-cheque destino-section">
            <div class="section-label destino"></div>
            <div class="grid">
                <div class="row">
                    <span class="destino_label label"></span>
                    <span class="destino value"></span>
                </div>
                <div class="row row-concepto-imputar">
                    <span class="label"></span>
                    <span class="cuenta_concepto_imputar value"></span>
                </div>
            </div>
        </div>
        <div class="section-cheque">
            <div class="section-label">Uso y Descripciones</div>
            <div class="grid">
                <div id="uso" class="row">
                    <span class="label">Uso</span>
                    <span class="uso value"></span>
                </div>
                <div class="row">
                    <span class="label">Observación</span>
                    <span class="observacion value"></span>
                </div>
                <div class="row row-motivo">
                    <span class="label">Motivo</span>
                    <span class="motivo value"></span>
                </div>
            </div>
        </div>
    </div>
    <div class="form-actions">
        <button type="button" class="btn btn-cancel" data-close-modal>Cerrar</button>
        <button type="button" id="btn-anular" class="btn btn-delete">Anular CH</button>
        <button type="button" id="btn-reject" class="btn btn-delete">Rechazar</button>
        <button type="button" id="btn-primary" class="btn btn-primary">Imputar CH</button>
    </div>
</div>
