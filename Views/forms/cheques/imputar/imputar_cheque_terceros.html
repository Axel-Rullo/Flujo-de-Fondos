<div class="form-title">IMPUTAR CHEQUE DE TERCEROS</div>
<form id="form-imputar-cheque-terceros" class="form-grid">
    <div class="form-group">
        <label for="uso">Uso <span>*</span></label>
        <select id="uso" name="uso" required>
            <option value="" disabled selected hidden>Elije una opción...</option>
            <option value="Deposito">Depósito</option>
            <option value="Endoso">Endoso</option>
        </select>
    </div>

    <div class="form-group">
        <label for="cuenta_entrada">Cuenta de Entrada <span>*</span><small> (depósito)</small></label>
        <select id="cuenta_entrada" name="id_cuenta_entrada" disabled></select>
    </div>

    <div class="form-group">
        <label for="titular_destino">Proveedor <span>*</span><small> (endoso)</small></label>
        <select id="titular_destino" name="id_titular_destino" disabled></select>
    </div>

    <div class="form-group">
        <label for="cuenta_salida">Cuenta de Salida <span>*</span><small> (endoso)</small></label>
        <select id="cuenta_salida" name="id_cuenta_salida" disabled></select>
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-cancel" data-close-modal>Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
</form>
