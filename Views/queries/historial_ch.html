<div class="cheques-container">
    <div class="header_cheques">
        <div class="title">
            <h2 class="lista_cheques"></h2>
        </div>
        <div class="filtros_cheques">
            <select id="clase-cheque" class="clase_cheque">
                <option value="P">P</option>
                <option value="T">T</option>
            </select>
            <select id="type-cheque" class="type_cheque">
                <option value="C" data-title="Cheques Cobrados"></option>
                <option value="R" data-title="Cheques Rechazados"></option>
                <option value="A" data-title="Cheques Anulados"></option>
            </select>
            <div class="input_icono">
                <svg class="icono_input"><use href="#icon-search"/></svg>
                <input type="text" id="buscador-cheque" class="buscador_cheques" placeholder="Buscar Cheque...">
            </div>
        </div>
    </div>
    <div id="tabla-cheques-historial"></div>
</div>
<script src="Scripts/dashboard/forms/cheques/chequeList.js"></script>
