        <header class="header">

                <img class="dashboard-logo" src="./Icons/logo.png" alt="Logo" width="24" height="24">

            <aside class="accordion">
                <div class="menu-group">
                    <button data-target="sub-conceptos">CONCEPTOS <span class="chevron"></span></button>
                    <div id="sub-conceptos" class="submenu">
                        <a data-modal="Views/forms/conceptos/new_concepto.html" href="#">NUEVO CONCEPTO</a>
                    </div>
                </div>

                <div class="menu-group">
                    <button data-target="sub-cheques">CHEQUES <span class="chevron"></span></button>

                    <svg width="18" height="18" viewBox="0 0 24 24"><use href="#file-export" xlink:href="#file-export"/></svg>

                <button class="tb-btn bt-clipro-list admin-only" data-modal="Views/forms/clientprov/clipro_list.html" title="Clientes/Proveedores" aria-label="Clientes/Proveedores">
                    <svg width="18" height="18" viewBox="0 0 24 24"><use href="#icon-clientes" xlink:href="#icon-clientes"/></svg>
                </button>
                <button class="tb-btn bt-user-list admin-only" title="Lista de Usuarios" aria-label="Lista de Usuarios" data-modal="./Views/forms/users/users_list.html">

                </button>
                <button class="tb-btn bt-user-list admin-only" title="Resumen Diario" aria-label="Resumen Diario" data-modal="./Views/forms/cheques/resumen_cheque.html">

                </button>
                <button id="btn-profile" class="tb-btn btn-profile" title="Mi perfil" aria-label="Mi perfil"></button>
                <button class="tb-btn bt-block-login" title="Bloquear sesión" aria-label="Bloquear sesión">
                    <svg width="18" height="18" viewBox="0 0 24 24"><use href="#block-login" xlink:href="#block-login"/></svg>
                </button>
            </div>
            <div class="tb-window-controls">
                <button class="tb-btn minimize" title="Minimizar" aria-label="Minimizar">
                    <svg width="14" height="14" viewBox="0 0 12 12"><line x1="1.5" y1="6" x2="10.5" y2="6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                </button>
                <button class="tb-btn maximize" title="Maximizar" aria-label="Maximizar">
                    <svg class="icon-maximize" width="14" height="14" viewBox="0 0 12 12"><rect fill="none" stroke="currentColor" stroke-width="1.2" x="2" y="2" width="8" height="8" rx="0.5"/></svg>
                    <svg class="icon-restore" style="display:none;" width="14" height="14" viewBox="0 0 12 12"><path fill="none" stroke="currentColor" stroke-width="1.2" d="M4 2h6v6M2 4h6v6H2z"/></svg>
                </button>
                <button class="tb-btn close" title="Cerrar" aria-label="Cerrar">
                    <svg width="14" height="14" viewBox="0 0 12 12"><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M2.5 2.5l7 7m-7 0l7-7"/></svg>
                </button>
            </div>
        </div>
